<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médical</title>
    <link rel="stylesheet" href="style.css">
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        /* Ajustements pour l'agenda */
        #calendar {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="appointment-form">
    <h2>Prendre un Rendez-vous</h2>
    <form id="createAppointmentForm">
        <input type="text" name="nom" placeholder="Nom du patient" required>
        <input type="text" name="prenom" placeholder="Prénom" required>
        <input type="text" name="telephone" placeholder="Téléphone" required>

        <label>Choisir une date :</label>
        <input type="date" id="datePicker" name="date_rdv" required>
        
        <div id="slotsContainer" style="margin-top:15px; display: flex; flex-wrap: wrap; gap: 10px;">
            <p>Veuillez choisir une date pour voir les créneaux libres.</p>
        </div>

        <input type="hidden" id="selectedSlotId" name="id_creneau" required>
        
        <button type="submit" id="submitBtn" disabled>Confirmer le rendez-vous</button>
    </form>
</div>

    <script src="script.js"></script>
</body>
</html>
